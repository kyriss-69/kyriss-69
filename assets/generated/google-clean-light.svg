<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 375" role="img" aria-labelledby="title description">
  <title id="title">Spécialisation Écosystème Google &amp; IA de Kyrris</title>
  <desc id="description">Présentation de la spécialisation dans les outils Google, Antigravity et Gemini.</desc>
  <defs>
    <linearGradient id="google-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="33%" stop-color="#a855f7"/>
      <stop offset="66%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#34a853"/>
    </linearGradient>
    <radialGradient id="ai-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4285f4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
    .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .rotate-orbit { transform-origin: 955px 202px; animation: rot-orbit 20s linear infinite; }
    .pulse-gemini { transform-origin: 955px 202px; animation: pulse-gem 3.5s ease-in-out infinite; }
    @keyframes rot-orbit { to { transform: rotate(360deg); } }
    @keyframes pulse-gem { 0%, 100% { transform: scale(0.94); opacity: 0.85; } 50% { transform: scale(1.06); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .rotate-orbit, .pulse-gemini { animation: none; } }
  </style>

  <!-- Fond & Bordure externe -->
  <rect width="1200" height="375" rx="22" fill="#faf5ff"/>
  <rect x="1" y="1" width="1198" height="373" rx="21" fill="none" stroke="#e9d5ff"/>

  <!-- En-tête -->
  <text x="60" y="48" class="mono" fill="#7e22ce" font-size="14" font-weight="700" letter-spacing="3">SPÉCIALISATION // ÉCOSYSTÈME GOOGLE &amp; IA AGENTIQUE</text>
  <path d="M780 43H1140" stroke="url(#google-gradient)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- PANNEAU GAUCHE : ÉPURÉ SANS BADGES, AVEC 30PX DE RESPIRATION EN BAS -->
  <g transform="translate(60 66)">
    <!-- Cadre étendu en hauteur pour une respiration maximale -->
    <rect width="680" height="276" rx="18" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.4"/>

    <!-- PILIER 1 : GOOGLE ANTIGRAVITY (2.0 & IDE) -->
    <g transform="translate(24 16)">
      <circle cx="16" cy="16" r="16" fill="#1e1035" stroke="#a855f7" stroke-width="1.2"/>
      <text x="16" y="22" text-anchor="middle" font-size="15">🌌</text>

      <text x="46" y="21" class="sans" fill="#2e1065" font-size="16" font-weight="750" letter-spacing="-0.2">Google Antigravity (2.0 &amp; IDE)</text>

      <text x="46" y="44" class="sans" fill="#6b21a8" font-size="12" font-weight="500">
        Maîtrise avancée du développement assisté par agents : subagents autonomes,
      </text>
      <text x="46" y="60" class="sans" fill="#6b21a8" font-size="12" font-weight="500">
        protocoles MCP (Model Context Protocol), skills et orchestration de contextes complexes.
      </text>
    </g>

    <!-- Séparateur 1 -->
    <line x1="24" y1="92" x2="656" y2="92" stroke="#e9d5ff" stroke-width="0.8" opacity="0.6"/>

    <!-- PILIER 2 : GOOGLE GEMINI -->
    <g transform="translate(24 104)">
      <circle cx="16" cy="16" r="16" fill="#151b3b" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="16" y="22" text-anchor="middle" font-size="15">✨</text>

      <text x="46" y="21" class="sans" fill="#2e1065" font-size="16" font-weight="750" letter-spacing="-0.2">Google Gemini</text>

      <text x="46" y="44" class="sans" fill="#6b21a8" font-size="12" font-weight="500">
        Exploitation de l&apos;intelligence artificielle Google : contexte étendu, function calling,
      </text>
      <text x="46" y="60" class="sans" fill="#6b21a8" font-size="12" font-weight="500">
        raisonnement multimodal et intégration directe dans des APIs TypeScript (Nest/Nuxt).
      </text>
    </g>

    <!-- Séparateur 2 -->
    <line x1="24" y1="180" x2="656" y2="180" stroke="#e9d5ff" stroke-width="0.8" opacity="0.6"/>

    <!-- PILIER 3 : GOOGLE CLOUD & VERTEX AI (30PX DE MARGE AU-DESSUS DU BAS) -->
    <g transform="translate(24 192)">
      <circle cx="16" cy="16" r="16" fill="#0f2926" stroke="#34d399" stroke-width="1.2"/>
      <text x="16" y="22" text-anchor="middle" font-size="15">☁️</text>

      <text x="46" y="21" class="sans" fill="#2e1065" font-size="16" font-weight="750" letter-spacing="-0.2">Google Cloud &amp; Vertex AI</text>

      <text x="46" y="42" class="sans" fill="#6b21a8" font-size="12" font-weight="500">
        Déploiement conteneurisé sur Cloud Run, gestion d&apos;infrastructures modernes,
      </text>
      <text x="46" y="58" class="sans" fill="#6b21a8" font-size="12" font-weight="500">
        intégration d&apos;APIs d&apos;intelligence artificielle et cloud sécurisé.
      </text>
    </g>
  </g>

  <!-- PANNEAU DROIT : HOLOGRAPHIC GEMINI & ANTIGRAVITY CORE -->
  <g id="google-hologram">
    <!-- Halo d'ambiance -->
    <circle cx="955" cy="202" r="126" fill="url(#ai-glow)"/>

    <!-- Anneau radar extérieur avec rotation -->
    <circle cx="955" cy="202" r="108" fill="none" stroke="#e9d5ff" stroke-width="1.4"/>
    <circle cx="955" cy="202" r="108" fill="none" stroke="url(#google-gradient)" stroke-width="2" stroke-dasharray="14 36 6 18" class="rotate-orbit"/>

    <!-- Anneau intermédiaire -->
    <circle cx="955" cy="202" r="78" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>

    <!-- Étoile Gemini 4 branches holographique -->
    <g class="pulse-gemini">
      <path d="M 955 160 Q 955 202 997 202 Q 955 202 955 244 Q 955 202 913 202 Q 955 202 955 160 Z"
            fill="url(#google-gradient)" filter="url(#glow-filter)"/>
      <circle cx="955" cy="202" r="5" fill="#ffffff"/>
    </g>

    <!-- Satellite Haut : ANTIGRAVITY 2.0 & IDE -->
    <g transform="translate(865 114)">
      <rect width="180" height="24" rx="12" fill="#ffffff" stroke="#a855f7" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#c084fc"/>
      <text x="24" y="16" class="mono" fill="#2e1065" font-size="9.5" font-weight="700" letter-spacing="0.6">ANTIGRAVITY // 2.0 &amp; IDE</text>
    </g>

    <!-- Satellite Bas : GOOGLE GEMINI -->
    <g transform="translate(885 266)">
      <rect width="140" height="24" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#60a5fa"/>
      <text x="24" y="16" class="mono" fill="#2e1065" font-size="9.5" font-weight="700" letter-spacing="0.8">GOOGLE GEMINI</text>
    </g>

    <!-- Statut en bas -->
    <text x="955" y="318" text-anchor="middle" class="mono" fill="#9333ea" font-size="10" font-weight="700" letter-spacing="2">GOOGLE AI // ÉCOSYSTÈME MAÎTRISÉ</text>
  </g>
</svg>
