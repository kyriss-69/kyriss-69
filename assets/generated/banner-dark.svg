<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Kyrris — DÉVELOPPEUR FULLSTACK TYPESCRIPT</title>
  <desc id="description">Bannière haute fidélité pour le profil de Kyrris avec terminal de code et texte dynamique.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090510"/>
      <stop offset="1" stop-color="#170b28"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="card-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#240f42" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Chemins animés pour l'effet texte dactylographié en boucle -->
    <path id="typePath0">
      <animate id="t0" attributeName="d" begin="0s;t3.end" dur="4.2s" fill="remove"
        values="m108,277 h0 ; m108,277 h540 ; m108,277 h540 ; m108,277 h0"
        keyTimes="0; 0.45; 0.82; 1" />
    </path>
    <path id="typePath1">
      <animate id="t1" attributeName="d" begin="t0.end" dur="4.2s" fill="remove"
        values="m108,277 h0 ; m108,277 h540 ; m108,277 h540 ; m108,277 h0"
        keyTimes="0; 0.45; 0.82; 1" />
    </path>
    <path id="typePath2">
      <animate id="t2" attributeName="d" begin="t1.end" dur="4.2s" fill="remove"
        values="m108,277 h0 ; m108,277 h540 ; m108,277 h540 ; m108,277 h0"
        keyTimes="0; 0.45; 0.82; 1" />
    </path>
    <path id="typePath3">
      <animate id="t3" attributeName="d" begin="t2.end" dur="4.2s" fill="remove"
        values="m108,277 h0 ; m108,277 h540 ; m108,277 h540 ; m108,277 h0"
        keyTimes="0; 0.45; 0.82; 1" />
    </path>
  </defs>
  <style>
    .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Fira Code", monospace; }
    .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)" opacity=".75"/>

  <!-- Halo lumineux d'ambiance néon -->
  <circle cx="940" cy="180" r="230" fill="url(#card-glow)"/>

  <!-- GAUCHE: IDENTITÉ & SLOGAN -->
  <path d="M42 40H246" stroke="url(#signal)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="42" cy="40" r="5" fill="#a855f7" filter="url(#soft-glow)"/>

  <text x="72" y="93" class="mono" fill="#a855f7" font-size="16" font-weight="700" letter-spacing="3">KYRISS-69 // DÉVELOPPEUR FULLSTACK TYPESCRIPT</text>
  <text x="68" y="169" class="sans" fill="#f5f3ff" font-size="58" font-weight="800" letter-spacing="-1.2">KYRRIS</text>
  <text x="72" y="214" class="mono" fill="#a78bfa" font-size="16" font-weight="600" letter-spacing="1.4">NUXT 3 · VUE 3 · NESTJS 11 · TURBOREPO · BUN · DOCKER</text>

  <!-- Pilule avec effet texte dactylographié (s'écrit, s'efface et boucle) -->
  <g transform="translate(68 252)">
    <rect width="615" height="50" rx="25" fill="#130924" stroke="#3b1569" stroke-width="1.6"/>
    <circle cx="25" cy="25" r="6" fill="#a855f7" filter="url(#soft-glow)"/>
  </g>

  <!-- Textes animés le long des chemins dynamiques -->
  <text class="mono" fill="#f5f3ff" font-size="12" font-weight="650" letter-spacing="0.4" dominant-baseline="middle">
    <textPath href="#typePath0" xlink:href="#typePath0">MONOREPO TURBOREPO PROPULSÉ PAR BUN ⚡</textPath>
  </text>
  <text class="mono" fill="#f5f3ff" font-size="12" font-weight="650" letter-spacing="0.4" dominant-baseline="middle">
    <textPath href="#typePath1" xlink:href="#typePath1">FRONTEND : NUXT 3 · VUE 3 · TAILWIND · PINIA 🌐</textPath>
  </text>
  <text class="mono" fill="#f5f3ff" font-size="12" font-weight="650" letter-spacing="0.4" dominant-baseline="middle">
    <textPath href="#typePath2" xlink:href="#typePath2">BACKEND : NESTJS 11 · PRISMA · POSTGRESQL · REDIS ⚙️</textPath>
  </text>
  <text class="mono" fill="#f5f3ff" font-size="12" font-weight="650" letter-spacing="0.4" dominant-baseline="middle">
    <textPath href="#typePath3" xlink:href="#typePath3">SPÉCIALISATION GOOGLE : ANTIGRAVITY 2.0 &amp; GEMINI 🌌</textPath>
  </text>

  <!-- DROITE: FENÊTRE TERMINAL IDE CODE AVEC SYNTAXE ÉCLATANTE -->
  <g transform="translate(710 42)">
    <rect width="445" height="276" rx="16" fill="#130924" stroke="#3b1569" stroke-width="1.6"/>

    <!-- En-tête de la fenêtre -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 H429 C437.84 0 445 7.16 445 16 V40 H0 Z" fill="#180b30"/>
    <line x1="0" y1="40" x2="445" y2="40" stroke="#3b1569" stroke-width="1"/>

    <!-- Boutons style macOS néon -->
    <circle cx="22" cy="20" r="5.5" fill="#ec4899"/>
    <circle cx="38" cy="20" r="5.5" fill="#c084fc"/>
    <circle cx="54" cy="20" r="5.5" fill="#a855f7"/>

    <!-- Onglet actif -->
    <rect x="74" y="8" width="138" height="26" rx="6" fill="#130924" stroke="#3b1569" stroke-width="1"/>
    <text x="88" y="25" class="mono" fill="#c084fc" font-size="11.5" font-weight="600">kyrris.config.ts</text>

    <!-- Pastille statut en ligne -->
    <circle cx="418" cy="20" r="4" fill="#10b981" filter="url(#soft-glow)"/>
    <text x="364" y="24" class="mono" fill="#a78bfa" font-size="10.5" font-weight="600">ONLINE</text>

    <!-- Code TypeScript moderne avec accolades, flèches et ponctuation parfaitement visibles -->
    <g class="mono" font-size="12" letter-spacing="0.2" fill="#f5f3ff">
      <text x="18" y="70" fill="#8b5cf6" font-weight="600">1</text>
      <text x="42" y="70"><tspan fill="#ec4899" font-weight="700">const</tspan> <tspan fill="#c084fc">developer</tspan> <tspan fill="#ec4899" font-weight="700">=</tspan> <tspan fill="#f5f3ff" font-weight="700">{</tspan></text>

      <text x="18" y="96" fill="#8b5cf6" font-weight="600">2</text>
      <text x="56" y="96"><tspan fill="#c084fc">name</tspan><tspan fill="#a78bfa" font-weight="700">:</tspan> <tspan fill="#a7f3d0">"Kyrris"</tspan><tspan fill="#f5f3ff" font-weight="700">,</tspan></text>

      <text x="18" y="122" fill="#8b5cf6" font-weight="600">3</text>
      <text x="56" y="122"><tspan fill="#c084fc">frontend</tspan><tspan fill="#a78bfa" font-weight="700">:</tspan> <tspan fill="#f5f3ff" font-weight="700">[</tspan><tspan fill="#a7f3d0">"Nuxt 3"</tspan><tspan fill="#f5f3ff">, </tspan><tspan fill="#a7f3d0">"Vue 3"</tspan><tspan fill="#f5f3ff">, </tspan><tspan fill="#a7f3d0">"Pinia"</tspan><tspan fill="#f5f3ff" font-weight="700">],</tspan></text>

      <text x="18" y="148" fill="#8b5cf6" font-weight="600">4</text>
      <text x="56" y="148"><tspan fill="#c084fc">backend</tspan><tspan fill="#a78bfa" font-weight="700">:</tspan> <tspan fill="#f5f3ff" font-weight="700">[</tspan><tspan fill="#a7f3d0">"NestJS 11"</tspan><tspan fill="#f5f3ff">, </tspan><tspan fill="#a7f3d0">"Prisma"</tspan><tspan fill="#f5f3ff" font-weight="700">],</tspan></text>

      <text x="18" y="174" fill="#8b5cf6" font-weight="600">5</text>
      <text x="56" y="174"><tspan fill="#c084fc">ai_suite</tspan><tspan fill="#a78bfa" font-weight="700">:</tspan> <tspan fill="#f5f3ff" font-weight="700">[</tspan><tspan fill="#60a5fa">"Antigravity 2.0"</tspan><tspan fill="#f5f3ff">, </tspan><tspan fill="#c084fc">"Gemini"</tspan><tspan fill="#f5f3ff" font-weight="700">],</tspan></text>

      <text x="18" y="200" fill="#8b5cf6" font-weight="600">6</text>
      <text x="56" y="200"><tspan fill="#c084fc">runtime</tspan><tspan fill="#a78bfa" font-weight="700">:</tspan> <tspan fill="#f5f3ff">()</tspan> <tspan fill="#ec4899" font-weight="800">=&gt;</tspan> <tspan fill="#fbcfe8">"⚡ Turborepo + Bun"</tspan></text>

      <text x="18" y="226" fill="#8b5cf6" font-weight="600">7</text>
      <text x="42" y="226"><tspan fill="#f5f3ff" font-weight="700">};</tspan></text>

      <text x="18" y="252" fill="#8b5cf6" font-weight="600">8</text>
      <text x="42" y="252"><tspan fill="#ec4899" font-weight="700">export default</tspan> <tspan fill="#c084fc">developer</tspan><tspan fill="#f5f3ff" font-weight="700">;</tspan><rect class="cursor" x="242" y="240" width="7" height="14" rx="1" fill="#a855f7"/></text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#3b1569"/>
</svg>
