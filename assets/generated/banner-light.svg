<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Kyrris — DÉVELOPPEUR WEB &amp; EXPLORATEUR IA</title>
  <desc id="description">Bannière haute fidélité pour le profil de Kyrris.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e22ce"/>
      <stop offset="0.55" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <radialGradient id="card-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7e22ce" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e9d5ff" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Fira Code", monospace; }
    .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)" opacity=".75"/>

  <!-- Halo lumineux d'ambiance néon -->
  <circle cx="940" cy="180" r="230" fill="url(#card-glow)"/>

  <!-- GAUCHE: IDENTITÉ & BADGES PROPRES -->
  <path d="M42 40H246" stroke="url(#signal)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="42" cy="40" r="5" fill="#7e22ce" filter="url(#soft-glow)"/>

  <text x="72" y="93" class="mono" fill="#7e22ce" font-size="16" font-weight="700" letter-spacing="3">KYRISS-69 // DÉVELOPPEUR WEB &amp; EXPLORATEUR IA</text>
  <text x="68" y="169" class="sans" fill="#2e1065" font-size="58" font-weight="800" letter-spacing="-1.2">KYRRIS</text>
  <text x="72" y="214" class="mono" fill="#6b21a8" font-size="16.5" font-weight="600" letter-spacing="1.6">REACT · NEXT.JS · TYPESCRIPT · NODE.JS · IA &amp; DATA</text>

  <!-- Badges de statut aérés et impeccables -->
  <g transform="translate(70 252)">
    <rect width="185" height="38" rx="19" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.4"/>
    <circle cx="20" cy="19" r="4.5" fill="#10b981" filter="url(#soft-glow)"/>
    <text x="35" y="24" class="mono" fill="#2e1065" font-size="11.5" font-weight="650" letter-spacing="0.6">DISPONIBLE // ACTIF</text>
  </g>
  <g transform="translate(268 252)">
    <rect width="215" height="38" rx="19" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.4"/>
    <text x="20" y="24" class="mono" fill="#9333ea" font-size="11.5" font-weight="650" letter-spacing="0.6">WEB FULLSTACK &amp; IA</text>
  </g>

  <!-- DROITE: FENÊTRE TERMINAL IDE CODE -->
  <g transform="translate(710 42)">
    <rect width="445" height="276" rx="16" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.6"/>

    <!-- En-tête de la fenêtre -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 H429 C437.84 0 445 7.16 445 16 V40 H0 Z" fill="#f3e8ff"/>
    <line x1="0" y1="40" x2="445" y2="40" stroke="#e9d5ff" stroke-width="1"/>

    <!-- Boutons style macOS néon -->
    <circle cx="22" cy="20" r="5.5" fill="#ec4899"/>
    <circle cx="38" cy="20" r="5.5" fill="#c084fc"/>
    <circle cx="54" cy="20" r="5.5" fill="#a855f7"/>

    <!-- Onglet actif -->
    <rect x="74" y="8" width="138" height="26" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="88" y="25" class="mono" fill="#9333ea" font-size="11.5" font-weight="600">kyrris.config.ts</text>

    <!-- Pastille statut en ligne -->
    <circle cx="418" cy="20" r="4" fill="#10b981" filter="url(#soft-glow)"/>
    <text x="364" y="24" class="mono" fill="#6b21a8" font-size="10.5" font-weight="600">ONLINE</text>

    <!-- Code TypeScript moderne -->
    <g class="mono" font-size="12" letter-spacing="0.2">
      <text x="18" y="70" fill="#6d28d9" font-weight="600">1</text>
      <text x="42" y="70"><tspan fill="#ec4899" font-weight="700">const</tspan> <tspan fill="#9333ea">developer</tspan> = {</text>

      <text x="18" y="96" fill="#6d28d9" font-weight="600">2</text>
      <text x="56" y="96"><tspan fill="#6b21a8">name</tspan>: <tspan fill="#a7f3d0">"Kyrris"</tspan>,</text>

      <text x="18" y="122" fill="#6d28d9" font-weight="600">3</text>
      <text x="56" y="122"><tspan fill="#6b21a8">role</tspan>: <tspan fill="#a7f3d0">"Fullstack &amp; AI Explorer"</tspan>,</text>

      <text x="18" y="148" fill="#6d28d9" font-weight="600">4</text>
      <text x="56" y="148"><tspan fill="#6b21a8">stack</tspan>: [<tspan fill="#a7f3d0">"Next.js"</tspan>, <tspan fill="#a7f3d0">"React"</tspan>, <tspan fill="#a7f3d0">"Node.js"</tspan>],</text>

      <text x="18" y="174" fill="#6d28d9" font-weight="600">5</text>
      <text x="56" y="174"><tspan fill="#6b21a8">passion</tspan>: <tspan fill="#a7f3d0">"AI Agents &amp; Modern Web"</tspan>,</text>

      <text x="18" y="200" fill="#6d28d9" font-weight="600">6</text>
      <text x="56" y="200"><tspan fill="#9333ea">build</tspan>: () =&gt; <tspan fill="#fbcfe8">"🚀 Ship clean code"</tspan></text>

      <text x="18" y="226" fill="#6d28d9" font-weight="600">7</text>
      <text x="42" y="226">};</text>

      <text x="18" y="252" fill="#6d28d9" font-weight="600">8</text>
      <text x="42" y="252"><tspan fill="#ec4899" font-weight="700">export default</tspan> <tspan fill="#9333ea">developer</tspan>;<rect class="cursor" x="238" y="240" width="7" height="14" rx="1" fill="#7e22ce"/></text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#e9d5ff"/>
</svg>
